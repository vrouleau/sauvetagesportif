name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  # ─── Create GitHub Release with notes ──────────────────────────────────────
  create-release:
    name: Create Release with Notes
    runs-on: ubuntu-latest
    outputs:
      is_latest: ${{ steps.latest.outputs.IS_LATEST }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # full history for changelog generation

      # Only the highest version gets the "Latest" badge / :latest Docker tag.
      # Without this, pushing several tags at once lets whichever run finishes
      # last win, even if it's an older version.
      - name: Determine if this is the highest version
        id: latest
        run: |
          HIGHEST=$(git tag -l 'v*' --sort=-v:refname | head -1)
          echo "Highest tag: $HIGHEST, this tag: $GITHUB_REF_NAME"
          if [ "$HIGHEST" = "$GITHUB_REF_NAME" ]; then
            echo "IS_LATEST=true" >> $GITHUB_OUTPUT
          else
            echo "IS_LATEST=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate release notes from commits
        id: notes
        run: |
          # Find previous tag reachable from this tag's parent (not just the
          # second-highest tag overall, which is wrong for older tags)
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)
          if [ -z "$PREV_TAG" ]; then
            PREV_TAG=$(git rev-list --max-parents=0 HEAD)
          fi
          echo "Previous tag: $PREV_TAG"

          # Generate notes grouped by conventional commit type
          {
            echo "NOTES<<EOF"

            # Features
            FEATS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --grep="^feat" --extended-regexp | grep -v "^$" || true)
            if [ -n "$FEATS" ]; then
              echo "### ✨ Features"
              echo ""
              echo "$FEATS"
              echo ""
            fi

            # Bug fixes
            FIXES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --grep="^fix" --extended-regexp | grep -v "^$" || true)
            if [ -n "$FIXES" ]; then
              echo "### 🐛 Bug Fixes"
              echo ""
              echo "$FIXES"
              echo ""
            fi

            # Docs
            DOCS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --grep="^docs" --extended-regexp | grep -v "^$" || true)
            if [ -n "$DOCS" ]; then
              echo "### 📝 Documentation"
              echo ""
              echo "$DOCS"
              echo ""
            fi

            # Other (refactor, chore, ci, etc.)
            OTHERS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --grep="^feat\|^fix\|^docs\|^release" --invert-grep --extended-regexp | grep -v "^$" || true)
            if [ -n "$OTHERS" ]; then
              echo "### 🔧 Other Changes"
              echo ""
              echo "$OTHERS"
              echo ""
            fi

            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.notes.outputs.NOTES }}
          draft: false
          prerelease: false
          make_latest: ${{ steps.latest.outputs.IS_LATEST }}

  # ─── Meet App: Windows x64 Installer ──────────────────────────────────────
  meet-app-windows:
    needs: create-release
    name: Meet App — Windows x64 Setup
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Rebuild better-sqlite3 for Electron
        working-directory: packages/meet-app
        run: npx @electron/rebuild -f -w better-sqlite3 -m ../..

      - name: Build & package
        working-directory: packages/meet-app
        run: npm run build:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer to release
        uses: softprops/action-gh-release@v3
        with:
          files: packages/meet-app/dist/*.exe

  # ─── Meet App: macOS Installer ─────────────────────────────────────────────
  meet-app-macos:
    needs: create-release
    name: Meet App — macOS DMG
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies (from monorepo root)
        run: npm install --include=optional

      - name: Rebuild better-sqlite3 for Electron
        working-directory: packages/meet-app
        run: npx @electron/rebuild -f -w better-sqlite3 -m ../..

      - name: Build & package
        working-directory: packages/meet-app
        run: npx electron-vite build && npx electron-builder --mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload DMG to release
        uses: softprops/action-gh-release@v3
        with:
          files: packages/meet-app/dist/*.dmg

  # ─── Team App: Docker Images ───────────────────────────────────────────────
  team-app-images:
    needs: create-release
    name: Team App — Docker Images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build and push backend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/team-app/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/team-backend:${{ steps.version.outputs.VERSION }}
            ${{ needs.create-release.outputs.is_latest == 'true' && format('ghcr.io/{0}/team-backend:latest', github.repository) || '' }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: packages/team-app/frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/team-frontend:${{ steps.version.outputs.VERSION }}
            ${{ needs.create-release.outputs.is_latest == 'true' && format('ghcr.io/{0}/team-frontend:latest', github.repository) || '' }}

# PostgreSQL overlay — adds a db service and points backend at it
# Usage: docker compose -f docker-compose.yml -f docker-compose.postgres.yml up --build -d

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: meetmgr
      POSTGRES_PASSWORD: meetmgr
      POSTGRES_DB: meetmgr
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meetmgr"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    environment:
      # Pin the psycopg2 driver explicitly. SQLAlchemy 2.1 changed the default
      # DBAPI for a bare "postgresql://" URL from psycopg2 to psycopg (v3);
      # we ship psycopg2-binary, so an unqualified scheme fails at create_engine
      # with "ModuleNotFoundError: No module named 'psycopg'".
      DATABASE_URL: postgresql+psycopg2://meetmgr:meetmgr@db:5432/meetmgr
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
